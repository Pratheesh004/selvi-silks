
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Selvi Silks - Grand Diwali 2.0</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 padding:15px 10px;
 text-align:center;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#f5e5ff,#e9d1ff,#fff0e6);
}

h1{
 color:#7200bd;
 font-size:32px;
 margin:10px 0;
}

.subtitle{
 color:#71318c;
 font-size:18px;
 margin-bottom:20px;
}

.booth{
 width:min(100%,540px);
 margin:auto;
 padding:12px;
 border:7px solid #e7c46d;
 border-radius:35px;
 background:linear-gradient(145deg,#8500d5,#5700a0,#30005c);
 box-shadow:0 12px 35px #55008035;
}

.heading{
 color:#fff0c2;
 font-size:21px;
 font-weight:bold;
 padding:12px 4px;
 letter-spacing:1px;
}

.stage{
 width:100%;
 aspect-ratio:1144 / 1375;
 overflow:hidden;
 background:#350052;
}

.stage canvas{
 width:100%;
 height:100%;
 display:block;
}

#result{
 display:none;
}

.wishes{
 margin-top:12px;
 padding:17px 5px;
 background:linear-gradient(135deg,#fff,#f1e2ff);
 color:#6500b5;
 border:3px solid #e7c46d;
 border-radius:20px;
 font:bold italic 30px Georgia,serif;
}

.wishes small{
 display:block;
 font:bold 14px Arial;
 margin-bottom:5px;
}

button{
 width:100%;
 margin-top:10px;
 padding:15px;
 border:2px solid #f4d995;
 border-radius:12px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
 background:#f0d17e;
 color:#4c087a;
}

button:disabled{
 opacity:.4;
 cursor:not-allowed;
}

.secondary{
 background:white;
 color:#6500b5;
 border-color:#d9b9ef;
}

.status{
 color:#6500a9;
 font-size:14px;
 margin:15px auto;
 line-height:1.5;
}

</style>
</head>

<body>

<h1>🪔 Selvi Silks 🪔</h1>

<div class="subtitle">
Capture Your Diwali Memories!
</div>

<div class="booth">

 <div class="heading">
 GRAND DIWALI SELFIE BOOTH
 </div>

 <div class="stage" id="liveStage">
  <canvas id="preview" width="1144" height="1375"></canvas>
 </div>

 <div class="stage" id="photoStage" style="display:none">
  <canvas id="result" width="1144" height="1375"></canvas>
 </div>

 <div class="wishes">
  <small>Wishing You a</small>
  Happy Diwali!
  <small>✨ Let Your Happiness Shine ✨</small>
 </div>

 <button id="start">📸 Start Camera</button>

 <button id="capture" disabled>
  ✨ Take Selfie
 </button>

 <button id="retake" class="secondary" disabled>
  🔄 Retake Photo
 </button>

 <button id="download" class="secondary" disabled>
  ⬇ Download Photo
 </button>

 <button id="whatsapp" disabled>
  💚 Share on WhatsApp
 </button>

 <button id="instagram" disabled>
  📷 Share on Instagram
 </button>

</div>

<div class="status" id="status">
Loading Diwali Frame...
</div>

<script>

// ===================================
// SETTINGS
// ===================================

const W=1144;
const H=1375;

const preview=document.getElementById("preview");
const pctx=preview.getContext("2d");

const result=document.getElementById("result");
const rctx=result.getContext("2d");

const video=document.createElement("video");

video.autoplay=true;
video.playsInline=true;
video.muted=true;

const status=document.getElementById("status");

let stream=null;
let active=false;
let photoReady=false;
let animation=null;


// ===================================
// LOAD ORIGINAL FRAME
// ===================================

const frame=new Image();

frame.src="./selvi-grand-diwali-frame.png";

const frameLoaded=new Promise((resolve,reject)=>{

 frame.onload=resolve;

 frame.onerror=()=>reject(
  new Error("Frame PNG not found. Check filename.")
 );

});


// ===================================
// BACKGROUND
// ===================================

function drawBackground(ctx){

 const g=ctx.createLinearGradient(0,0,W,H);

 g.addColorStop(0,"#260039");
 g.addColorStop(.5,"#500078");
 g.addColorStop(1,"#21002e");

 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

}


// ===================================
// CAMERA IMAGE
// ===================================

function drawCamera(ctx){

 if(!video.videoWidth) return;

 const vw=video.videoWidth;
 const vh=video.videoHeight;

 const targetRatio=W/H;
 const sourceRatio=vw/vh;

 let sx=0;
 let sy=0;
 let sw=vw;
 let sh=vh;

 if(sourceRatio>targetRatio){

  sw=vh*targetRatio;
  sx=(vw-sw)/2;

 }else{

  sh=vw/targetRatio;
  sy=(vh-sh)/2;

 }

 ctx.save();

 // Mirror selfie camera

 ctx.translate(W,0);
 ctx.scale(-1,1);

 ctx.drawImage(
  video,
  sx,sy,sw,sh,
  0,0,W,H
 );

 ctx.restore();

}


// ===================================
// CAMERA OPENING
// ===================================

// Only the upper-middle opening
// receives the camera.
// Bottom 2.0 artwork stays protected.

function drawCameraWindow(ctx){

 ctx.save();

 ctx.beginPath();

 // Top-left below logo

 ctx.moveTo(385,395);

 // Top curve

 ctx.bezierCurveTo(
  300,395,
  235,445,
  220,525
 );

 // Left side

 ctx.bezierCurveTo(
  195,620,
  200,770,
  240,855
 );

 // Bottom-left curve

 ctx.bezierCurveTo(
  275,915,
  340,935,
  420,935
 );

 // Bottom edge

 ctx.bezierCurveTo(
  520,945,
  625,945,
  725,935
 );

 // Bottom-right curve

 ctx.bezierCurveTo(
  810,935,
  875,915,
  905,855
 );

 // Right side

 ctx.bezierCurveTo(
  945,770,
  950,620,
  920,525
 );

 // Top-right curve

 ctx.bezierCurveTo(
  900,445,
  835,395,
  755,395
 );

 ctx.closePath();

 ctx.clip();

 drawCamera(ctx);

 ctx.restore();

}


// ===================================
// FINAL COMPOSITION
// ===================================

function drawFinal(ctx){

 // Background

 drawBackground(ctx);

 // Camera inside central opening only

 if(video.videoWidth){

  drawCameraWindow(ctx);

 }

 // Entire original frame on top.
 // Do not crop or resize the frame.

 ctx.drawImage(
  frame,
  0,
  0,
  W,
  H
 );

}


// ===================================
// INITIAL FRAME
// ===================================

async function initialize(){

 try{

  await frameLoaded;

  drawFinal(pctx);

  status.textContent=
   "Frame Ready! Click Start Camera.";

 }catch(error){

  status.textContent=error.message;

 }

}

initialize();


// ===================================
// LIVE CAMERA PREVIEW
// ===================================

function livePreview(){

 if(!active) return;

 drawFinal(pctx);

 animation=requestAnimationFrame(livePreview);

}


// ===================================
// START CAMERA
// ===================================

document.getElementById("start").onclick=async()=>{

 try{

  await frameLoaded;

  status.textContent="Opening Camera...";

  if(!navigator.mediaDevices?.getUserMedia){

   throw new Error("Open this website using HTTPS or localhost.");

  }

  if(stream){

   stream.getTracks().forEach(t=>t.stop());

  }

  stream=await navigator.mediaDevices.getUserMedia({

   video:{
    facingMode:"user",
    width:{ideal:1280},
    height:{ideal:1600}
   },

   audio:false

  });

  video.srcObject=stream;

  await new Promise((resolve,reject)=>{

   video.onloadedmetadata=resolve;
   video.onerror=reject;

  });

  await video.play();

  active=true;
  photoReady=false;

  document.getElementById("liveStage").style.display="block";
  document.getElementById("photoStage").style.display="none";

  document.getElementById("capture").disabled=false;

  document.getElementById("download").disabled=true;
  document.getElementById("whatsapp").disabled=true;
  document.getElementById("instagram").disabled=true;
  document.getElementById("retake").disabled=true;

  cancelAnimationFrame(animation);

  livePreview();

  status.textContent="Camera Ready! Position yourself inside the frame.";

 }catch(error){

  status.textContent="Camera Error: "+error.message;

 }

};


// ===================================
// TAKE PHOTO - FIXED
// ===================================

document.getElementById("capture").onclick=()=>{

 if(!video.videoWidth || !active) return;

 // Draw final photo BEFORE stopping preview

 drawFinal(rctx);

 active=false;

 cancelAnimationFrame(animation);

 // Hide live preview

 document.getElementById("liveStage").style.display="none";

 // IMPORTANT: Show captured canvas itself

 document.getElementById("photoStage").style.display="block";

 result.style.display="block";

 photoReady=true;

 document.getElementById("capture").disabled=true;
 document.getElementById("download").disabled=false;
 document.getElementById("whatsapp").disabled=false;
 document.getElementById("instagram").disabled=false;
 document.getElementById("retake").disabled=false;

 status.textContent="Your Diwali Selfie is Ready!";

};


// ===================================
// CREATE PHOTO FILE
// ===================================

function getFile(){

 return new Promise((resolve,reject)=>{

  result.toBlob(blob=>{

   if(!blob){

    reject(new Error("Photo creation failed."));
    return;

   }

   resolve(new File(
    [blob],
    "Selvi-Silks-Diwali.png",
    {type:"image/png"}
   ));

  },"image/png");

 });

}


// ===================================
// DOWNLOAD PHOTO
// ===================================

document.getElementById("download").onclick=async()=>{

 if(!photoReady) return;

 try{

  const file=await getFile();

  const url=URL.createObjectURL(file);

  const a=document.createElement("a");

  a.href=url;
  a.download=file.name;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),60000);

  status.textContent="Photo Downloaded Successfully!";

 }catch(error){

  status.textContent=error.message;

 }

};


// ===================================
// SHARE PHOTO
// ===================================

async function sharePhoto(app){

 if(!photoReady) return;

 try{

  const file=await getFile();

  if(
   navigator.share &&
   navigator.canShare &&
   navigator.canShare({files:[file]})
  ){

   await navigator.share({

    files:[file],

    title:"Selvi Silks Grand Diwali 2.0",

    text:"Happy Diwali from Selvi Silks! 🪔✨"

   });

  }else{

   const url=URL.createObjectURL(file);

   const a=document.createElement("a");

   a.href=url;
   a.download=file.name;

   a.click();

   setTimeout(()=>URL.revokeObjectURL(url),60000);

   if(app==="WhatsApp"){

    window.open(
     "https://wa.me/?text="+
     encodeURIComponent("Happy Diwali from Selvi Silks! 🪔"),
     "_blank"
    );

   }else{

    window.open("https://www.instagram.com/","_blank");

   }

   status.textContent=
    "Photo downloaded. Attach it in "+app+".";

  }

 }catch(error){

  if(error.name!=="AbortError"){

   status.textContent=error.message;

  }

 }

}

document.getElementById("whatsapp").onclick=()=>{
 sharePhoto("WhatsApp");
};

document.getElementById("instagram").onclick=()=>{
 sharePhoto("Instagram");
};


// ===================================
// RETAKE PHOTO
// ===================================

document.getElementById("retake").onclick=()=>{

 if(!stream) return;

 photoReady=false;
 active=true;

 document.getElementById("liveStage").style.display="block";
 document.getElementById("photoStage").style.display="none";

 result.style.display="none";

 document.getElementById("capture").disabled=false;
 document.getElementById("download").disabled=true;
 document.getElementById("whatsapp").disabled=true;
 document.getElementById("instagram").disabled=true;
 document.getElementById("retake").disabled=true;

 cancelAnimationFrame(animation);

 livePreview();

 status.textContent="Ready for another selfie!";

};


// ===================================
// STOP CAMERA
// ===================================

window.addEventListener("pagehide",()=>{

 active=false;

 cancelAnimationFrame(animation);

 if(stream){

  stream.getTracks().forEach(t=>t.stop());

 }

});

</script>

</body>
</html>
